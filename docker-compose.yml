version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: ms-storefront-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: storefront
    ports:
      - "5431:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - ecommerce-net
networks:
  ecommerce-net:
    name: ecommerce-net
    external: true

volumes:
  db_data: